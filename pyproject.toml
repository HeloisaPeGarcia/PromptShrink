[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptshrink"
version = "0.2.0"
description = "Pre-processador de prompts de IA: reduz tokens, economiza dinheiro."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tiktoken>=0.7",
    "rich>=13.7",
    "typer>=0.12",
    "pyperclip>=1.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.scripts]
promptshrink = "promptshrink.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
